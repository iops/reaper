[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reaper-scanner"
version = "0.2.0"
description = "AI Agent Vulnerability Scanner"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "@onemanops" },
]
dependencies = [
    "click>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/iops/reaper"
Repository = "https://github.com/iops/reaper"
Issues = "https://github.com/iops/reaper/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "build>=1.0",
]

[project.scripts]
reaper = "reaper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["reaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
target-version = "py312"

